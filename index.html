<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وردة شامية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{margin:0;background:#fffaf5;color:#2d2d2d}
.hero{height:65vh;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?w=1200');background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff}
.hero h1{font-size:3.5rem;margin:0} .hero h1 span{color:#ffd700}
.btn{margin-top:20px;background:#ffd700;color:#000;padding:14px 36px;border-radius:30px;font-weight:bold;text-decoration:none}
.container{max-width:1100px;margin:auto;padding:30px 20px}
.title{text-align:center;font-size:2rem;color:#5a2e0c}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;margin-top:20px}
.card{background:#1e1e1e;border-radius:20px;padding:18px;text-align:center;color:#fff;border:1px solid #333}
.card img{width:100%;height:200px;object-fit:cover;border-radius:15px;background:#333}
.card .price{color:#00ff88;font-weight:bold;font-size:1.2rem}
.surprise{grid-column:1/-1;background:#fffbeb;border:3px dashed #f59e0b;border-radius:20px;padding:15px;display:flex;gap:15px;align-items:center}
.surprise img{width:140px;height:100px;border-radius:15px}
</style>
</head>
<body>
<div class="hero">
<h1>وردة <span>شامية</span></h1>
<p>مطعم سوري • أم درمان - أصالة الشام في قلب أم درمان</p>
<a class="btn" href="#">احجز طاولة</a>
</div>

<div class="container">
<h2 class="title">قائمتنا</h2>
<div class="grid">
<div class="card">
<img src="https://images.unsplash.com/photo-1525183995014-b329225b9407?w=600&auto=format&fit=crop" onerror="this.src='https://picsum.photos/400/300?random=1'">
<h3>شاورما دجاج</h3><div class="price">SDG 7,000</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=600&auto=format&fit=crop" onerror="this.src='https://picsum.photos/400/300?random=2'">
<h3>شاورما لحم</h3><div class="price">SDG 9,000</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=600&auto=format&fit=crop" onerror="this.src='https://picsum.photos/400/300?random=3'">
<h3>مشاوي مشكلة</h3><div class="price">SDG 10,000</div>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1565557623262-b51c2513a641?w=600&auto=format&fit=crop" onerror="this.src='https://picsum.photos/400/300?random=4'">
<h3>فلافل ذهبية</h3><div class="price">SDG 2,000</div>
</div>

<div class="card surprise" style="color:#333">
<img src="https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=600&auto=format&fit=crop">
<div style="text-align:right">
<h3 style="margin:0;color:#92400e">🔥 كرسبي فاهيتا - مفاجأة ليلة الافتتاح</h3>
<p>جديد • مقرمشة ولذيذة</p>
</div>
</div>

</div>
</div>
</body>
</html>
